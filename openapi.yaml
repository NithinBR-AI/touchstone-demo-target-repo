components:
  schemas:
    Order:
      properties:
        id:
          type: integer
        status:
          maxLength: 20
          nullable: true
          type: string
        total:
          format: decimal
          nullable: true
          type: number
        user_id:
          nullable: true
          type: integer
      required:
      - id
      type: object
    Product:
      properties:
        id:
          type: integer
        name:
          maxLength: 100
          type: string
        price:
          format: decimal
          nullable: true
          type: number
        stock:
          nullable: true
          type: integer
      required:
      - id
      - name
      type: object
    User:
      properties:
        age:
          nullable: true
          type: integer
        created_at:
          format: date-time
          type: string
        email:
          maxLength: 255
          type: string
        id:
          type: integer
        loyalty_tier:
          description: Customer loyalty tier (bronze/silver/gold) — declared in spec
            but not yet returned by API
          nullable: true
          type: string
      required:
      - id
      - email
      type: object
info:
  description: 'Customer-facing REST API for the Touchstone demo target.

    This openapi.yaml is the SOURCE OF TRUTH for what the API *should* look like.

    Touchstone''s contract-observer app scans a live service and compares it against

    this spec to detect contract drift.

    '
  title: Customer Service API
  version: 1.0.0
openapi: 3.1.0
paths:
  /orders:
    get:
      operationId: listOrders
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Order'
                type: array
          description: Array of order objects
      summary: List all orders
  /orders/{id}:
    get:
      operationId: getOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: An order object
        '404':
          description: Order not found
      summary: Fetch a single order
  /products:
    get:
      operationId: listProducts
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Product'
                properties:
                  sku:
                    type: string
                type: array
          description: Array of product objects
      summary: List all products
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
          description: Array of user objects
      summary: List all users
  /users/{id}:
    get:
      operationId: getUser
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: A user object
        '404':
          description: User not found
      summary: Fetch a single user
servers:
- description: Render deployment (live)
  url: https://touchstone-demo-target.onrender.com
- description: Local dev server
  url: http://localhost:9000
