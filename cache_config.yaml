# cache_config.yaml — declared cache contract for touchstone-demo-target
#
# This is the SOURCE OF TRUTH for which keys SHOULD exist in Redis.
# Touchstone's poltergeist app compares this against the live Redis instance
# to detect cache drift.
#
# Intentional drift baked in for demo:
#   · products:list declared here but never populated by the app (KEY_MISSING)
#   · debug:session_dump exists in Redis but is NOT declared here (UNDECLARED_KEY)

keys:
  users:list:
    description: Cached list of all users
  orders:list:
    description: Cached list of all orders
  products:list:
    description: Cached list of all products